<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="SaResO — Plataforma social global de vídeo, emprego e comunicação."
    />
    <meta name="application-name" content="SaResO" />
    <meta name="theme-color" content="#1E90FF" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS (iPhone / iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaResO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / Open Graph -->
    <meta property="og:title" content="SaResO" />
    <meta
      property="og:description"
      content="Plataforma social global de vídeo, emprego e comunicação."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <title>SaResO</title>
    <style>
      body {
        margin: 0;
      }

      .app-loading {
        align-items: center;
        background: #0a0f1e;
        color: #1e90ff;
        display: flex;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        gap: 0.75rem;
        justify-content: center;
        min-height: 100vh;
      }

      .app-loading__indicator {
        animation: app-loading-spin 0.8s linear infinite;
        border: 2px solid currentColor;
        border-radius: 9999px;
        border-top-color: transparent;
        height: 1rem;
        width: 1rem;
      }

      @keyframes app-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-loading__indicator {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="app-loading" data-app-loading role="status" aria-live="polite">
        <span class="app-loading__indicator" aria-hidden="true"></span>
        <span style="color: #1e90ff; font-weight: 600">SaResO</span>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js");
        });
      }
    </script>
  </body>
</html>
